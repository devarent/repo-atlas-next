<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Devarent — next-gen tech monogram</title>
  <desc id="d">Bold geometric D monogram with neon cyan-to-violet gradient, orbit ring and circuit accents on deep navy.</desc>
  <defs>
    <linearGradient id="mark" x1="0.08" y1="0.05" x2="0.92" y2="0.95">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="52%" cy="48%" r="55%">
      <stop offset="0" stop-color="#4F46E5" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8AA0C8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#070B14"/>
  <rect width="512" height="512" rx="112" fill="url(#grid)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="142" fill="#6366F1" opacity="0.22" filter="url(#soft)"/>

  <!-- orbit -->
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#mark)" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="256" cy="44" r="6" fill="#22D3EE"/>
  <circle cx="256" cy="468" r="4" fill="#A855F7"/>

  <!-- D monogram -->
  <path d="M150 120 H268 C348 120 392 180 392 256 C392 332 348 392 268 392 H150 Z" fill="url(#mark)"/>
  <path d="M204 178 H266 C310 178 334 213 334 256 C334 299 310 334 266 334 H204 Z" fill="#070B14"/>
  <path d="M150 120 H268 C348 120 392 180 392 256" fill="none" stroke="#A5F3FC" stroke-opacity="0.75" stroke-width="3"/>

  <!-- circuit accents -->
  <g fill="none" stroke="#8AA0C8" stroke-opacity="0.45" stroke-width="2">
    <path d="M64 168h44l16-16h26"/>
    <path d="M448 344h-44l-16 16h-26"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="64" cy="168" r="5"/>
    <circle cx="448" cy="344" r="5"/>
  </g>
  <g fill="#A855F7">
    <circle cx="448" cy="168" r="3.5"/>
    <circle cx="64" cy="344" r="3.5"/>
  </g>
</svg>
