<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">AF — Arya Fatthurahman monogram, version 3</title>
  <desc id="d">Geometric AF monogram with gradient outline and orbit rings on deep navy.</desc>
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93A4C8" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#080C18"/>
  <rect width="512" height="512" rx="112" fill="url(#grid)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <circle cx="404" cy="418" r="96" fill="#22D3EE" opacity="0.10" filter="url(#soft)"/>

  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#mark)" stroke-opacity="0.5" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="url(#mark)" stroke-opacity="0.28" stroke-width="1.5"/>

  <g fill="none" stroke="url(#mark)" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
    <!-- A · left leg -->
    <path d="M112 398 L176 398 L252 146 L212 134 Z"/>
    <!-- A · right leg -->
    <path d="M212 134 L252 146 L328 398 L264 398 Z"/>
    <!-- A · crossbar -->
    <rect x="168" y="302" width="112" height="27" rx="4"/>
    <!-- F · stem -->
    <rect x="352" y="146" width="31" height="252" rx="5"/>
    <!-- F · top bar -->
    <rect x="352" y="146" width="94" height="31" rx="5"/>
    <!-- F · middle bar -->
    <rect x="352" y="250" width="74" height="27" rx="5"/>
  </g>

  <!-- precision accents -->
  <g fill="none" stroke="#93A4C8" stroke-opacity="0.38" stroke-width="1.5">
    <path d="M84 128h44l18 18h34"/>
    <path d="M428 384h-44l-18-18h-34"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="84" cy="128" r="4"/>
    <circle cx="428" cy="384" r="4"/>
  </g>
  <g fill="#A855F7">
    <circle cx="428" cy="128" r="4"/>
    <circle cx="84" cy="384" r="4"/>
  </g>
</svg>
