<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Devarent — Astral mark</title>
  <desc id="d">Geometric D monogram in an astral gradient of pink, violet, blue and cyan, with orbit ring and film grain on deep space.</desc>
  <defs>
    <linearGradient id="mark" x1="0.04" y1="0.08" x2="0.96" y2="0.94">
      <stop offset="0" stop-color="#FF9BD2"/>
      <stop offset="0.32" stop-color="#8B5CF6"/>
      <stop offset="0.66" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#4DE1FF"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD1EC" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#C4B5FD" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4DE1FF" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="auroraA" cx="18%" cy="14%" r="62%">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraB" cx="86%" cy="26%" r="58%">
      <stop offset="0" stop-color="#4DE1FF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#4DE1FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraC" cx="64%" cy="94%" r="62%">
      <stop offset="0" stop-color="#FF5CAA" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FF5CAA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFB86B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFB86B" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="clip">
      <rect width="512" height="512" rx="116"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="#06070E"/>
    <rect width="512" height="512" fill="url(#auroraA)"/>
    <rect width="512" height="512" fill="url(#auroraB)"/>
    <rect width="512" height="512" fill="url(#auroraC)"/>
    <ellipse cx="380" cy="420" rx="210" ry="160" fill="url(#orb)"/>

    <!-- orbit system -->
    <circle cx="256" cy="256" r="206" fill="none" stroke="url(#rim)" stroke-opacity="0.42" stroke-width="1.6"/>
    <circle cx="256" cy="256" r="168" fill="none" stroke="url(#rim)" stroke-opacity="0.2" stroke-width="1"/>
    <circle cx="256" cy="50" r="6.5" fill="#4DE1FF"/>
    <circle cx="256" cy="50" r="12" fill="#4DE1FF" opacity="0.28" filter="url(#soft)"/>
    <circle cx="424" cy="352" r="4.5" fill="#FF9BD2"/>
    <circle cx="424" cy="352" r="9" fill="#FF9BD2" opacity="0.3" filter="url(#soft)"/>
    <circle cx="96" cy="330" r="3.5" fill="#FFB86B"/>

    <!-- D monogram -->
    <g>
      <path d="M146 118 H268 C350 118 394 178 394 256 C394 334 350 394 268 394 H146 Z" fill="#7C5CFF" opacity="0.45" filter="url(#soft)"/>
      <path d="M146 118 H268 C350 118 394 178 394 256 C394 334 350 394 268 394 H146 Z" fill="url(#mark)"/>
      <path d="M202 176 H266 C312 176 336 212 336 256 C336 300 312 336 266 336 H202 Z" fill="#06070E"/>
      <path d="M146 118 H268 C350 118 394 178 394 256" fill="none" stroke="#FFE1F1" stroke-opacity="0.75" stroke-width="2.6"/>
      <path d="M146 394 H268" stroke="#0B1020" stroke-opacity="0.35" stroke-width="3"/>
    </g>

    <!-- circuit / data accents -->
    <g fill="none" stroke="#A9B6E0" stroke-opacity="0.35" stroke-width="1.6">
      <path d="M52 176h34l14-14h22"/>
      <path d="M460 344h-34l-14 14h-22"/>
      <path d="M72 420h28l12-12h18"/>
    </g>
    <g fill="#4DE1FF">
      <circle cx="52" cy="176" r="4"/>
      <circle cx="72" cy="420" r="3"/>
    </g>
    <g fill="#FF9BD2">
      <circle cx="460" cy="344" r="4"/>
    </g>

    <!-- grain -->
    <rect width="512" height="512" filter="url(#grain)" opacity="0.16" style="mix-blend-mode:overlay"/>
    <rect width="512" height="512" rx="116" fill="none" stroke="url(#rim)" stroke-opacity="0.22" stroke-width="2"/>
  </g>
</svg>
